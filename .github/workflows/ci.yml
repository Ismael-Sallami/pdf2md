# Converts the committed fixture PDF and checks what comes out, so the badge
# means the tool works and not just that the file parses.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      # OCR is not exercised: it needs Tesseract and its language models, and a
      # test that installs them checks Tesseract, not this converter.
      - name: Convert the fixture end to end
        run: |
          python3 src/pdf_to_md.py tests/fixtures/sample.pdf --output /tmp/out
          echo "--- output.md ---"
          cat /tmp/out/output.md
